# STAGED ONLY. DO NOT AUTOMATICALLY INSTALL ON main.
# Must be installed by owner after explicit approval and a verified dry run.
# GitHub schedules workflows on default branch, so this file is shipped outside
# .github/workflows/ in this deliverable. Moving it is a separate, auditable act.
name: Atlas v1.0 scheduled v0.9 paper research (no real orders)

on:
  workflow_dispatch:
  schedule:
    # UTC: repeat 7 and 22 minutes after each CLOSED 4h candle.
    # Best-effort, never guaranteed; stale cycles are SAFELY skipped.
    - cron: '7,22 0,4,8,12,16,20 * * *'

permissions:
  contents: read

concurrency:
  group: atlas-v09-shadow-ledger
  cancel-in-progress: false

jobs:
  isolated_virtual_cycle:
    if: github.repository == 'janneswiele/atlas-trading-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # Only push the isolated v0.9 data branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: atlas-v0.9
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v09.txt
      - run: python -m pip install -r requirements-v09.txt
      - id: window
        name: Permit only fresh 4h UTC window
        run: |
          python - <<'PY'
          import os, time
          after_close=int(time.time()) % 14400
          eligible=300 <= after_close <= 2400
          print('UTC seconds since latest close:', after_close)
          if not eligible:
              print('SAFE_SKIP: early/late execution. No synthetic backfill or reset.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('eligible='+str(eligible).lower()+'\n')
          PY
      - name: Restore existing immutable v0.9 ledger (never create/reset)
        if: steps.window.outputs.eligible == 'true'
        run: |
          git ls-remote --exit-code --heads origin refs/heads/atlas-v0.9-data
          git fetch origin refs/heads/atlas-v0.9-data
          git worktree add --detach ../atlas-state FETCH_HEAD
          test -f ../atlas-state/ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          from atlas09.core import source_hash, validate_state
          s=json.loads(Path('../atlas-state/ledger.json').read_text())
          c=json.loads(Path('atlas_v09_config.json').read_text())
          validate_state(s,c,source_hash(Path.cwd()))
          if s.get('version')!='0.9' or not s.get('activation'):
              raise ValueError('No existing v0.9 activation')
          PY
      - id: cycle
        name: Virtual 4h cycle only; no activation or live API
        if: steps.window.outputs.eligible == 'true'
        continue-on-error: true
        run: python atlas_v09.py --directory ../atlas-state --git-ledger
      - name: Safely push additional error observations
        if: always() && steps.window.outputs.eligible == 'true' && steps.cycle.outcome != 'skipped'
        run: |
          test -f ../atlas-state/ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          from atlas09.core import source_hash, validate_state
          validate_state(json.loads(Path('../atlas-state/ledger.json').read_text()),
                         json.loads(Path('atlas_v09_config.json').read_text()),source_hash(Path.cwd()))
          PY
          git -C ../atlas-state config user.name 'github-actions[bot]'
          git -C ../atlas-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in ledger.json dashboard.html quality.json; do
            if [ -f "../atlas-state/$file" ]; then git -C ../atlas-state add -- "$file"; fi
          done
          if ! git -C ../atlas-state diff --cached --quiet; then
            git -C ../atlas-state commit -m 'Append isolated v0.9 virtual observations'
            git -C ../atlas-state push origin HEAD:refs/heads/atlas-v0.9-data
          fi
      - name: Copy audit artifacts safely into workspace
        if: always() && steps.window.outputs.eligible == 'true'
        run: |
          mkdir -p atlas-shadow-audit
          for file in ledger.json dashboard.html quality.json; do
            if [ -f "../atlas-state/$file" ]; then
              cp -- "../atlas-state/$file" "atlas-shadow-audit/$file"
            fi
          done
      - if: always() && steps.window.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-v10-shadow-audit
          path: atlas-shadow-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Expose failed virtual cycle
        if: steps.cycle.outcome == 'failure'
        run: exit 1
