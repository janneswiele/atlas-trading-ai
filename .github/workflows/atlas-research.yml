
name: Atlas Historical Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Research BTC/EUR history
        run: python atlas_v07.py --days 730 --output atlas-research-output

      - name: Save research results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-research-results
          path: atlas-research-output/
          retention-days: 14
