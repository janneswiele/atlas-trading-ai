name: Atlas v0.8.3 Entry and Exit Attribution (Research Only)
on:
  push:
    branches: [atlas-v0.8]
    paths:
      - atlas_v083.py
      - test_atlas_v083.py
      - ATLAS_V083.md
      - .github/workflows/atlas-v083.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-v083-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/atlas-v0.8'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v08.txt
      - name: Install existing research dependencies
        run: python -m pip install -r requirements-v08.txt
      - name: Syntax and full regression suite
        run: |
          python -m compileall -q .
          python -m pytest -q
      - name: Retrieve actual official Kraken BTC/EUR 4h archive data
        run: |
          python atlas_v08_kraken_fetch.py \
            --start 2023-10-02T00:00:00Z \
            --end 2026-10-01T00:00:00Z \
            --output atlas-data/XBTEUR_240.csv \
            --manifest atlas-data/kraken_provenance.json
      - name: Reproduce original pre-holdout Coinbase and Kraken research
        run: |
          python atlas_v08.py \
            --days 1095 \
            --end 2026-10-01T00:00:00Z \
            --kraken-csv atlas-data/XBTEUR_240.csv \
            --output atlas-v08-research
      - name: Attribute actual executed trades and validate original equity
        run: |
          python atlas_v083.py \
            --input atlas-v08-research \
            --output atlas-v083-diagnostics
      - name: Preserve provenance and audit artifacts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-v083-entry-exit-audit
          path: |
            atlas-data/kraken_provenance.json
            atlas-v08-research/manifest.json
            atlas-v08-research/release_gate.json
            atlas-v08-research/data_quality_report.json
            atlas-v083-diagnostics/
          if-no-files-found: warn
          retention-days: 14
