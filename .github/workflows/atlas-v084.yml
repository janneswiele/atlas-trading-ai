name: Atlas v0.8.4 Frozen Candidate Research (NO TRADING)

on:
  push:
    branches: [atlas-v0.8]
    paths:
      - atlas_v084.py
      - test_atlas_v084.py
      - ATLAS_V084.md
      - .github/workflows/atlas-v084.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-v084-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/atlas-v0.8'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v08.txt
      - name: Install frozen v0.8 dependencies
        run: python -m pip install -r requirements-v08.txt
      - name: Compile and run complete regression suite (NO TRADING)
        run: |
          python -m compileall -q .
          python -m pytest -q
      - name: Retrieve official Kraken historical BTC/EUR 4h data
        run: |
          python atlas_v08_kraken_fetch.py \
            --start 2023-10-02T00:00:00Z \
            --end 2026-10-01T00:00:00Z \
            --output atlas-data/XBTEUR_240.csv \
            --manifest atlas-data/kraken_provenance.json
      - name: Reproduce unchanged baseline and sealed global holdout
        run: |
          python atlas_v08.py \
            --days 1095 \
            --end 2026-10-01T00:00:00Z \
            --kraken-csv atlas-data/XBTEUR_240.csv \
            --output atlas-v08-research
      - name: Compare only two frozen candidates against exact original baselines
        run: |
          python atlas_v084.py \
            --input atlas-v08-research \
            --output atlas-v084-frozen-research \
            --bootstrap 10000
      - name: Preserve researcher audit and provenance even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-v084-exploratory-no-trading
          path: |
            atlas-data/kraken_provenance.json
            atlas-v08-research/manifest.json
            atlas-v08-research/release_gate.json
            atlas-v08-research/data_quality_report.json
            atlas-v084-frozen-research/
          if-no-files-found: warn
          retention-days: 14
