

name: Atlas Autonomes Paper Trading
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-paper
  cancel-in-progress: false

jobs:
  paper:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Virtuellen Handelszyklus ausführen
        id: cycle
        run: python paper.py
      - name: Konto und Status speichern
        if: ${{ always() && steps.cycle.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json
          for file in paper_status.json paper_state.pre-v04.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update Atlas paper simulation"
            git push origin HEAD:main
          fi
      - name: Wiederherstellbare Laufdaten
        if: ${{ always() && steps.cycle.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            paper_state.json
            paper_status.json
            paper_state.pre-v04.json
          retention-days: 14
