name: Atlas v0.8 Official Kraken Archive Check
on:
  push:
    branches: [atlas-v0.8]
    paths:
      - atlas_v08_kraken_fetch.py
      - test_atlas_v08_kraken_fetch.py
      - .github/workflows/atlas-v08-kraken.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-v08-kraken-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kraken-research:
    if: github.ref == 'refs/heads/atlas-v0.8'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v08.txt
      - name: Install existing project dependencies
        run: python -m pip install -r requirements-v08.txt
      - name: Full regression and remote ZIP tests
        run: |
          python -m compileall -q .
          python -m pytest -q
      - name: Selectively fetch verified official Kraken BTC/EUR CSV via HTTP Range
        run: |
          python atlas_v08_kraken_fetch.py \
            --start 2023-10-02T00:00:00Z \
            --end 2026-10-01T00:00:00Z \
            --output atlas-data/XBTEUR_240.csv \
            --manifest atlas-data/kraken_provenance.json
      - name: Run full-history Coinbase/Kraken research with sealed holdout
        run: |
          python atlas_v08.py \
            --days 1095 \
            --end 2026-10-01T00:00:00Z \
            --kraken-csv atlas-data/XBTEUR_240.csv \
            --output atlas-v08-research
      - name: Keep diagnostics, source audit and research results even if blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-v08-official-data-diagnostics
          path: |
            atlas-data/kraken_provenance.json
            atlas-data/XBTEUR_240.csv
            atlas-v08-research/
          if-no-files-found: warn
          retention-days: 14
