
name: Atlas quality checks

on:
  pull_request:
  push:
    branches: [atlas-v0.4]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-v08.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q
