name: Atlas v0.8.2 Exposure and Causal Benchmark Diagnostics
on:
  push:
    branches: [atlas-v0.8]
    paths:
      - atlas_v082.py
      - test_atlas_v082.py
      - .github/workflows/atlas-v082.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-v082-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark-diagnostics:
    if: github.ref == 'refs/heads/atlas-v0.8'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v08.txt
      - name: Install project dependencies (unchanged)
        run: python -m pip install -r requirements-v08.txt
      - name: Syntax and all regression checks
        run: |
          python -m compileall -q .
          python -m pytest -q
      - name: Retrieve official Kraken BTC/EUR archives without full download
        run: |
          python atlas_v08_kraken_fetch.py \
            --start 2023-10-02T00:00:00Z \
            --end 2026-10-01T00:00:00Z \
            --output atlas-data/XBTEUR_240.csv \
            --manifest atlas-data/kraken_provenance.json
      - name: Reproduce v0.8.1 pre-holdout historical research
        run: |
          python atlas_v08.py \
            --days 1095 \
            --end 2026-10-01T00:00:00Z \
            --kraken-csv atlas-data/XBTEUR_240.csv \
            --output atlas-v08-research
      - name: Independent v0.8.2 pre-window volatility diagnostics
        run: |
          python atlas_v082.py \
            --input atlas-v08-research \
            --output atlas-v082-diagnostics
      - name: Archive input audit and diagnostic result even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-v082-benchmark-diagnostics
          path: |
            atlas-data/kraken_provenance.json
            atlas-v08-research/manifest.json
            atlas-v08-research/release_gate.json
            atlas-v08-research/data_quality_report.json
            atlas-v08-research/per_window_results.csv
            atlas-v08-research/equity_windows.csv
            atlas-v082-diagnostics/
          if-no-files-found: warn
          retention-days: 14
