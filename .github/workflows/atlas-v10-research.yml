name: Atlas v1.0 isolated research quality checks

on:
  push:
    branches: [atlas-v1.0-development]
  pull_request:
    branches: [atlas-v1.0-development, main]

permissions:
  contents: read

concurrency:
  group: atlas-v10-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit_and_research_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v09.txt
      - run: python -m pip install -r requirements-v09.txt
      - name: Syntax check
        run: python -m compileall -q atlas10 atlas_v10.py
      - name: Full regressions and v1.0 tests
        run: python -m pytest -q --junitxml=v10-test-results.xml
      - name: Synthetic offline research smoke test (NOT real returns)
        run: |
          python atlas_v10.py research \
            --csv examples/atlas10/SYNTHETIC_4h.csv \
            --approval examples/atlas10/SYNTHETIC_4h.approval.json \
            --out atlas-v10-results
          python atlas_v10.py propose \
            --report atlas-v10-results/research.json --out atlas-v10-results
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-v10-offline-research-tests
          path: |
            v10-test-results.xml
            atlas-v10-results/
          if-no-files-found: warn
          retention-days: 14
