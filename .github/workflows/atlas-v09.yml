name: Atlas v0.9 isolated shadow research

on:
  push:
    branches: [atlas-v0.9]
  pull_request:
    branches: [atlas-v0.9, main]
  # No schedule or Run workflow on this research branch: GitHub requires
  # default-branch registration. Only an explicit command-file push can cycle.

permissions:
  contents: read

concurrency:
  group: atlas-v09-shadow-ledger
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      action: ${{ steps.command.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v09.txt
      - run: python -m pip install -r requirements-v09.txt
      - run: python -m compileall -q atlas09 atlas_v09.py atlas_v085.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - id: command
        name: Enable shadow ONLY on an explicit command-file commit
        run: |
          python - <<'PY'
          import json, os
          cfg=json.load(open('atlas_v09_config.json'))
          command=json.load(open('atlas_v09_command.json'))
          action=command['action']
          if action not in ('disabled','activate','cycle'):
              raise ValueError('Unrecognised shadow command')
          if os.environ.get('GITHUB_EVENT_NAME') != 'push' or os.environ.get('GITHUB_REF') != 'refs/heads/atlas-v0.9':
              action='disabled'
          else:
              event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
              changed=set()
              for commit in event.get('commits',[]):
                  for key in ('added','modified','removed'):
                      changed.update(commit.get(key, []))
              head=event.get('head_commit') or {}
              for key in ('added','modified','removed'):
                  changed.update(head.get(key, []))
              # Commits of code/docs/workflows never trigger a shadow run.
              if 'atlas_v09_command.json' not in changed:
                  action='disabled'
          if not cfg['enabled']:
              action='disabled'
          print('Atlas requested action:', action)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('action='+action+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-v09-tests
          path: test-results.xml
          retention-days: 30
  shadow:
    needs: tests
    # No writes for pull requests, forks, other branches, or disabled installations.
    if: >-
      github.repository == 'janneswiele/atlas-trading-ai' &&
      github.ref == 'refs/heads/atlas-v0.9' &&
      github.event_name == 'push' &&
      needs.tests.outputs.action != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v09.txt
      - run: python -m pip install -r requirements-v09.txt
      - id: window
        name: Check UTC 4h close window; safely skip late or early runs
        run: |
          python - <<'PY'
          import os, time
          seconds_since_utc_4h_close = int(time.time()) % 14400
          # Existing core requires age <= 3600 s; reserve time for API reads.
          eligible = 300 <= seconds_since_utc_4h_close <= 2400
          print('Seconds after latest 4h UTC close:', seconds_since_utc_4h_close)
          if not eligible:
              print('SAFE_SKIP: outside the 5–40 min post-close window; NO trade, NO reset.')
              print('Try another explicit command-file commit during the next window.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('eligible=' + str(eligible).lower() + '\n')
          PY
      - name: Restore durable isolated data branch; never reset missing state
        if: steps.window.outputs.eligible == 'true'
        env:
          REQUEST: ${{ needs.tests.outputs.action }}
        run: |
          set +e
          git ls-remote --exit-code --heads origin refs/heads/atlas-v0.9-data > /tmp/atlas-data-ref
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            git fetch origin refs/heads/atlas-v0.9-data
            git worktree add --detach ../atlas-state FETCH_HEAD
            test -f ../atlas-state/ledger.json
            test "$REQUEST" != activate
          elif [ "$found" -eq 2 ] && [ "$REQUEST" = activate ]; then
            git worktree add --orphan -b atlas-v0.9-data ../atlas-state
          else
            echo 'State inaccessible or absent without explicit first activation. STOP.'
            exit 1
          fi
      - id: run
        name: Observe closed candles and later public quote
        if: steps.window.outputs.eligible == 'true'
        continue-on-error: true
        env:
          REQUEST: ${{ needs.tests.outputs.action }}
        run: |
          if [ "$REQUEST" = activate ]; then
            python atlas_v09.py --directory ../atlas-state --git-ledger --activate
          else
            python atlas_v09.py --directory ../atlas-state --git-ledger
          fi
      - name: Persist decisions and errors using a normal fast-forward push
        if: always() && steps.window.outputs.eligible == 'true' && steps.run.outcome != 'skipped'
        run: |
          test -f ../atlas-state/ledger.json
          python - <<'PY'
          import json
          from atlas09.core import validate_state, source_hash
          from pathlib import Path
          validate_state(json.load(open('../atlas-state/ledger.json')),json.load(open('atlas_v09_config.json')),source_hash(Path.cwd()))
          PY
          git -C ../atlas-state config user.name 'github-actions[bot]'
          git -C ../atlas-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in ledger.json dashboard.html quality.json; do
            if [ -f "../atlas-state/$file" ]; then git -C ../atlas-state add -- "$file"; fi
          done
          if ! git -C ../atlas-state diff --cached --quiet; then
            git -C ../atlas-state commit -m 'Append Atlas shadow research observations'
            git -C ../atlas-state push origin HEAD:refs/heads/atlas-v0.9-data
          fi
      - name: Copy audit files into workspace (GitHub artifact path safety)
        if: always() && steps.window.outputs.eligible == 'true'
        run: |
          mkdir -p atlas-v09-shadow-audit
          for file in ledger.json dashboard.html quality.json; do
            if [ -f "../atlas-state/$file" ]; then
              cp -- "../atlas-state/$file" "atlas-v09-shadow-audit/$file"
            fi
          done
          if [ -d ../atlas-state/raw ]; then
            mkdir -p atlas-v09-shadow-audit/raw
            cp -a ../atlas-state/raw/. atlas-v09-shadow-audit/raw/
          fi
      - if: always() && steps.window.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-v09-shadow-audit
          path: atlas-v09-shadow-audit/
          if-no-files-found: warn
          retention-days: 30
      - name: Expose failed cycle
        if: steps.run.outcome == 'failure'
        run: exit 1
