name: Atlas v0.9 isolated shadow research

on:
  push:
    branches: [atlas-v0.9]
  pull_request:
    branches: [atlas-v0.9, main]
  workflow_dispatch:
  # GitHub only schedules workflows installed on the DEFAULT branch.
  # This update deliberately does not install/merge anything into main.
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read

concurrency:
  group: atlas-v09-shadow-ledger
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      action: ${{ steps.command.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'atlas-v0.9' || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v09.txt
      - run: python -m pip install -r requirements-v09.txt
      - run: python -m compileall -q atlas09 atlas_v09.py atlas_v085.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - id: command
        name: Read explicit research command
        run: |
          python - <<'PY'
          import json, os
          cfg=json.load(open('atlas_v09_config.json'))
          action=json.load(open('atlas_v09_command.json'))['action']
          if action not in ('disabled','activate','cycle'): raise ValueError('Invalid command')
          if not cfg['enabled']: action='disabled'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('action='+action+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-v09-tests
          path: test-results.xml
          retention-days: 30
  shadow:
    needs: tests
    # No writes for pull requests, forks, other branches, or disabled installations.
    if: >-
      github.repository == 'janneswiele/atlas-trading-ai' &&
      (github.ref == 'refs/heads/atlas-v0.9' || github.event_name == 'schedule') &&
      github.event_name != 'pull_request' &&
      needs.tests.outputs.action != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'schedule' && 'atlas-v0.9' || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v09.txt
      - run: python -m pip install -r requirements-v09.txt
      - name: Restore durable isolated data branch; never reset missing state
        env:
          REQUEST: ${{ needs.tests.outputs.action }}
        run: |
          set +e
          git ls-remote --exit-code --heads origin refs/heads/atlas-v0.9-data > /tmp/atlas-data-ref
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            git fetch origin refs/heads/atlas-v0.9-data
            git worktree add --detach ../atlas-state FETCH_HEAD
            test -f ../atlas-state/ledger.json
            test "$REQUEST" != activate
          elif [ "$found" -eq 2 ] && [ "$REQUEST" = activate ]; then
            git worktree add --orphan -b atlas-v0.9-data ../atlas-state
          else
            echo 'State inaccessible or absent without explicit first activation. STOP.'
            exit 1
          fi
      - id: run
        name: Observe closed candles and later public quote
        continue-on-error: true
        env:
          REQUEST: ${{ needs.tests.outputs.action }}
        run: |
          if [ "$REQUEST" = activate ]; then
            python atlas_v09.py --directory ../atlas-state --git-ledger --activate
          else
            python atlas_v09.py --directory ../atlas-state --git-ledger
          fi
      - name: Persist decisions and errors using a normal fast-forward push
        if: always() && steps.run.outcome != 'skipped'
        run: |
          test -f ../atlas-state/ledger.json
          python - <<'PY'
          import json
          from atlas09.core import validate_state, source_hash
          from pathlib import Path
          validate_state(json.load(open('../atlas-state/ledger.json')),json.load(open('atlas_v09_config.json')),source_hash(Path.cwd()))
          PY
          git -C ../atlas-state config user.name 'github-actions[bot]'
          git -C ../atlas-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in ledger.json dashboard.html quality.json; do
            if [ -f "../atlas-state/$file" ]; then git -C ../atlas-state add -- "$file"; fi
          done
          if ! git -C ../atlas-state diff --cached --quiet; then
            git -C ../atlas-state commit -m 'Append Atlas shadow research observations'
            git -C ../atlas-state push origin HEAD:refs/heads/atlas-v0.9-data
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-v09-shadow-audit
          path: |
            ../atlas-state/ledger.json
            ../atlas-state/dashboard.html
            ../atlas-state/quality.json
            ../atlas-state/raw/
          if-no-files-found: warn
          retention-days: 30
      - name: Expose failed cycle
        if: steps.run.outcome == 'failure'
        run: exit 1
